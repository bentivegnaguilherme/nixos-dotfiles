# Noctalia appends/maintains the theme include below; other settings are preserved.
# Drop the Wayland title bar (maximize/close buttons) so niri rounds kitty
# like every other window via geometry-corner-radius.
hide_window_decorations yes

# Inner padding between text and window edges.
window_padding_width 14
window_padding_top 6

# Cursor trail animation (kitty >= 0.42). Trail length in frames; decay
# controls how quickly it fades. Threshold ignores tiny cursor jumps.
cursor_trail 3
cursor_trail_start_threshold 2
cursor_trail_decay 0.1 0.4

include themes/noctalia.conf
