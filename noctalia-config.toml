# Noctalia configuration — all settings at their defaults (v5).
# Declarative base for the GUI overrides in ~/.local/state/noctalia/settings.toml.
# Most changes are hot-reloaded via inotify; startup-only settings are noted inline.

# ── Shell ─────────────────────────────────────────────────────────────────────

[accessibility]
ui_scale              = 1.0
high_contrast         = false

[shell]
corner_radius_scale   = 1.0          # 0 = square, 1 = default, 2 = extra rounded
font_family           = "sans-serif"
time_format           = "{:%H:%M}"  # default shell UI time format
date_format           = "%A, %x"    # default shell UI date format
offline_mode          = false        # block all outgoing HTTP when true
# panel_anchor_bar   = "main"        # bar panels attach to without a source bar; omit = first enabled bar
telemetry_enabled     = false        # send an anonymous startup ping
niri_overview_type_to_launch_enabled = false # opt in to type-to-launch from niri overview
polkit_agent          = false
password_style        = "default"    # default | random
settings_show_advanced = true        # show advanced settings by default in Settings
# settings_window_translucent = false  # translucent settings window background
show_location         = true         # hide weather location text in shell UI when false
clipboard_enabled     = true         # false disables clipboard panel, history, and compositor clipboard hooks
clipboard_history_max_entries = 100 # unpinned history cap (10–10000); pinned entries are extra
clipboard_keep_from_closed_apps = true # keep the last copied item pasteable after the app you copied it from closes
clipboard_auto_paste  = "auto"       # off | auto | ctrl_v | ctrl_shift_v | shift_insert
clipboard_image_action_command = ""  # image preview action: gimp {path}, or satty -f - via stdin
shared_gl_context     = true         # startup-only; false isolates GPU contexts for broken drivers

[shell.privacy]
mic_filter_regex = ""
cam_filter_regex = ""
screen_filter_regex = ""

[shell.animation]
enabled = true
speed   = 1.0

[shell.shadow]
direction = "down"
alpha     = 0.55

[shell.panel]
transparency_mode     = "solid"
borders               = true
shadow                = true
launcher_placement       = "floating"
clipboard_placement      = "floating"
control_center_placement = "attached"
wallpaper_placement      = "attached"
session_placement        = "attached"
launcher_position        = "center"
clipboard_position       = "center"
open_near_click_control_center = false
open_near_click_launcher       = false
open_near_click_clipboard      = false
open_near_click_wallpaper      = false
open_near_click_session        = false

[shell.launcher]
categories    = true
show_icons    = true
show_app_origin_indicator = true
compact       = false
app_grid      = false
sort_by_usage = true
pinned        = []
fetch_exchange_rates = true
provider_prefix = "/"
auto_paste = "auto"

[shell.launcher.providers.calculator]
prefix = "calc"
global = true

[shell.launcher.providers.emoji]
prefix = "emo"

[shell.launcher.providers.session]
prefix = "session"
global = false

[shell.launcher.providers.wallpaper]
prefix = "wall"

[shell.launcher.providers.windows]
prefix = "win"

[shell.mpris]
blacklist = []

# ── Wallpaper ─────────────────────────────────────────────────────────────────

[wallpaper]
enabled             = true
fill_mode           = "crop"
fill_color          = ""
transition          = ["fade", "wipe", "disc", "stripes", "zoom", "honeycomb"]
transition_duration = 1500
edge_smoothness     = 0.3
transition_on_startup = false
directory           = "~/Pictures/Wallpapers"
directory_light     = ""
directory_dark      = ""

[wallpaper.default]
path = ""

[wallpaper.automation]
enabled                    = false
interval_seconds           = 1800
order                      = "random"
recursive                  = true

# ── Theme ─────────────────────────────────────────────────────────────────────

[theme]
mode   = "dark"
source = "builtin"
builtin = "Noctalia"
pure_black_dark = false

[theme.templates]
enable_builtin_templates            = true
builtin_ids                = []
enable_community_templates = true
community_ids              = []

# ── Backdrop ──────────────────────────────────────────────────────────────────

[backdrop]
enabled                = false
blur_intensity         = 0.5
tint_intensity         = 0.3

# ── Notifications ─────────────────────────────────────────────────────────────

[notification]
enable_daemon      = true
show_app_name      = true
show_actions       = true
layer              = "top"
scale              = 1.0
background_opacity = 0.97
offset_x           = 20
offset_y           = 8

# ── OSD ───────────────────────────────────────────────────────────────────────

[osd]
position = "top_right"
position_vertical = "top_center"
orientation = "horizontal"
scale = 1.0
background_opacity = 0.97
offset_x = 20
offset_y = 8

[osd.kinds]
volume = true
volume_output = true
volume_input = true
brightness = true
wifi = true
bluetooth = true
power_profile = true
caffeine = true
nightlight = true
dnd = true
lock_keys = true
keyboard_layout = true
privacy = true

# ── Lock Screen ───────────────────────────────────────────────────────────────

[lockscreen]
enabled                 = true
blurred_desktop         = false
blur_intensity          = 0.5
tint_intensity          = 0.3

# ── System Monitor ────────────────────────────────────────────────────────────

[system.monitor]
enabled = true
cpu_poll_seconds = 2.0
cpu_freq_activity_threshold = 2.5
cpu_freq_critical_threshold = 4.5
gpu_poll_seconds = 5.0
memory_poll_seconds = 2.0
network_poll_seconds = 3.0
disk_poll_seconds = 10.0

# ── Calendar ──────────────────────────────────────────────────────────────────

[calendar]
enabled                     = false
refresh_minutes             = 15

[control_center.calendar]
show_events_card            = true
show_week_numbers           = false
event_date_format           = "%A %e %B"
event_time_format           = "%H:%M"

# ── Weather ───────────────────────────────────────────────────────────────────

[weather]
enabled         = false
refresh_minutes = 30
unit            = "celsius"
effects         = true

# ── Audio ─────────────────────────────────────────────────────────────────────

[audio]
enable_overdrive = false
enable_sounds = false
sound_volume = 0.5
volume_change_sound = ""
notification_sound = ""

# ── Brightness ────────────────────────────────────────────────────────────────

[brightness]
enable_ddcutil = false

# ── Night Light ───────────────────────────────────────────────────────────────

[nightlight]
enabled              = false
force                = false
temperature_day      = 6500
temperature_night    = 4000

# ── Location ──────────────────────────────────────────────────────────────────

[location]
auto_locate      = false
address          = ""

# ── Idle ──────────────────────────────────────────────────────────────────────

[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = false

[idle.behavior.screen-off]
timeout = 660
action = "screen_off"
enabled = false

# ── Keybinds ──────────────────────────────────────────────────────────────────

[keybinds]
validate = ["return", "kp_enter", "space"]
cancel   = ["escape"]
left     = ["left"]
right    = ["right"]
up       = ["up"]
down     = ["down"]
tab_next = ["tab"]
tab_previous = ["shift+iso_left_tab"]
delete   = ["del"]

# ── Bar ───────────────────────────────────────────────────────────────────────

[bar.main]
position           = "top"
thickness          = 34
background_opacity = 1.0
radius             = 12
margin_ends        = 180
margin_edge        = 10
padding            = 14
widget_spacing     = 6
scale              = 1.0
shadow             = true
auto_hide          = false
reserve_space      = true
capsule            = false

start  = ["launcher", "wallpaper", "workspaces"]
center = ["clock"]
end    = ["media", "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "control-center", "session"]

# ── Dock ──────────────────────────────────────────────────────────────────────

[dock]
enabled             = false
position            = "bottom"
icon_size           = 48
main_axis_padding   = 16
cross_axis_padding  = 8
item_spacing        = 6
background_opacity  = 0.88
radius              = 16
radius_top_left     = 16
radius_top_right    = 16
radius_bottom_left  = 16
radius_bottom_right = 16
margin_ends         = 0
margin_edge         = 8
shadow              = true
show_running        = true
auto_hide           = false
reserve_space       = true
layer               = "top"
active_scale        = 1.0
inactive_scale      = 0.85
magnification       = true
magnification_scale = 1.45
active_opacity      = 1.0
inactive_opacity    = 0.85
show_dots           = false
show_instance_count = true
launcher_position   = "none"
launcher_icon       = "grid-dots"
active_monitor_only = false
pinned              = []

# ── Desktop Widgets ───────────────────────────────────────────────────────────

[desktop_widgets]
enabled = false

# ── Control Center / Widgets / Hooks ─────────────────────────────────────────

[hooks]