# Noctalia config — merged export promoted from the running setup (v5).
# Live GUI overrides still layer on top from ~/.local/state/noctalia/settings.toml.

[accessibility]
high_contrast = false
ui_scale = 1.0

[audio]
enable_overdrive = false
enable_sounds = false
notification_sound = ""
sound_volume = 0.5
volume_change_sound = ""

[backdrop]
blur_intensity = 0.5
enabled = false
tint_intensity = 0.29999999999999999

[bar.main]
auto_hide = false
background_opacity = 1.0
capsule = false
center = [ "clock" ]
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "control-center",
    "session"
]
margin_edge = 0
margin_ends = 0
padding = 40
position = "top"
radius = 0
reserve_space = false
scale = 1.0
shadow = true
smart_auto_hide = true
start = [ "launcher", "workspaces" ]
thickness = 34
widget_spacing = 10

[brightness]
enable_ddcutil = false

[calendar]
enabled = false
refresh_minutes = 15

[control_center]
hidden_tabs = [ "monitor", "power" ]

    [control_center.calendar]
    event_date_format = "%A %e %B"
    event_time_format = "%H:%M"
    show_events_card = true
    show_week_numbers = false

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
active_monitor_only = false
active_opacity = 1.0
active_scale = 1.0
auto_hide = false
background_opacity = 0.88
cross_axis_padding = 8
enabled = false
icon_size = 48
inactive_opacity = 0.84999999999999998
inactive_scale = 0.84999999999999998
item_spacing = 6
launcher_icon = "grid-dots"
launcher_position = "none"
layer = "top"
magnification = true
magnification_scale = 1.45
main_axis_padding = 16
margin_edge = 8
margin_ends = 0
pinned = []
position = "bottom"
radius = 16
radius_bottom_left = 16
radius_bottom_right = 16
radius_top_left = 16
radius_top_right = 16
reserve_space = true
shadow = true
show_dots = false
show_instance_count = true
show_running = true

[hooks]

[idle.behavior.lock]
action = "lock"
enabled = false
timeout = 600

[idle.behavior.screen-off]
action = "screen_off"
enabled = false
timeout = 660

[keybinds]
cancel = [ "escape" ]
delete = [ "del" ]
down = [ "down" ]
left = [ "left" ]
right = [ "right" ]
tab_next = [ "tab" ]
tab_previous = [ "shift+iso_left_tab" ]
up = [ "up" ]
validate = [ "return", "kp_enter", "space" ]

[location]
address = ""
auto_locate = true

[lockscreen]
blur_intensity = 0.5
blurred_desktop = false
enabled = true
tint_intensity = 0.29999999999999999

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-3", "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-2"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-3"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = false
force = false
temperature_day = 6500
temperature_night = 4000

[notification]
background_opacity = 0.96999999999999997
enable_daemon = true
layer = "top"
offset_x = 20
offset_y = 8
scale = 1.0
show_actions = true
show_app_name = true

[osd]
background_opacity = 0.96999999999999997
offset_x = 20
offset_y = 8
orientation = "horizontal"
position = "top_right"
position_vertical = "top_center"
scale = 1.0

    [osd.kinds]
    bluetooth = true
    brightness = true
    caffeine = true
    dnd = true
    keyboard_layout = true
    lock_keys = true
    nightlight = true
    power_profile = true
    privacy = true
    volume = true
    volume_input = true
    volume_output = true
    wifi = true

[shell]
button_borders = false
card_borders = false
clipboard_auto_paste = "auto"
clipboard_enabled = true
clipboard_history_max_entries = 100
clipboard_image_action_command = ""
clipboard_keep_from_closed_apps = true
corner_radius_scale = 1.0
date_format = "%A, %x"
font_family = "JetBrains Mono"
input_borders = false
niri_overview_type_to_launch_enabled = false
offline_mode = false
password_style = "default"
polkit_agent = false
popup_borders = false
settings_show_advanced = true
shared_gl_context = true
show_location = true
telemetry_enabled = false
time_format = "{:%H:%M}"

    [shell.animation]
    enabled = true
    speed = 1.0

    [shell.launcher]
    app_grid = false
    auto_paste = "auto"
    categories = false
    compact = true
    fetch_exchange_rates = true
    pinned = []
    provider_prefix = "/"
    show_app_origin_indicator = true
    show_icons = true
    sort_by_usage = true

        [shell.launcher.providers.calculator]
        global = true
        prefix = "calc"

        [shell.launcher.providers.emoji]
        prefix = "emo"

        [shell.launcher.providers.session]
        global = false
        prefix = "session"

        [shell.launcher.providers.wallpaper]
        prefix = "wall"

        [shell.launcher.providers.windows]
        prefix = "win"

    [shell.mpris]
    blacklist = []

    [shell.panel]
    borders = false
    clipboard_placement = "floating"
    clipboard_position = "center"
    control_center_placement = "attached"
    launcher_placement = "floating"
    launcher_position = "center"
    open_near_click_clipboard = false
    open_near_click_control_center = false
    open_near_click_launcher = false
    open_near_click_session = false
    open_near_click_wallpaper = false
    session_placement = "attached"
    shadow = true
    transparency_mode = "solid"
    wallpaper_placement = "attached"

    [shell.privacy]
    cam_filter_regex = ""
    mic_filter_regex = ""
    screen_filter_regex = ""

    [shell.screen_corners]
    enabled = true
    size = 10

    [shell.shadow]
    alpha = 0.55000000000000004
    direction = "down"

[system.monitor]
cpu_freq_activity_threshold = 2.5
cpu_freq_critical_threshold = 4.5
cpu_poll_seconds = 2.0
disk_poll_seconds = 10.0
enabled = false
gpu_poll_seconds = 5.0
memory_poll_seconds = 2.0
network_poll_seconds = 3.0

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
custom_palette = "1371177-mc"
mode = "dark"
pure_black_dark = false
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kitty", "niri", "qt", "starship" ]
    community_ids = []
    enable_builtin_templates = true
    enable_community_templates = true

[wallpaper]
directory = "~/Pictures/Wallpapers"
directory_dark = ""
directory_light = ""
edge_smoothness = 0.29999999999999999
enabled = true
fill_color = ""
fill_mode = "crop"
transition = [ "fade", "wipe", "disc", "stripes", "zoom", "honeycomb" ]
transition_duration = 1500
transition_on_startup = false

    [wallpaper.automation]
    enabled = false
    interval_seconds = 1800
    order = "random"
    recursive = true

    [wallpaper.default]
    path = "/home/gui/Pictures/Wallpapers/1371177.png"

    [wallpaper.last]
    path = "/home/gui/Pictures/Wallpapers/1371177.png"

    [wallpaper.monitors.DP-2]
    path = "/home/gui/Pictures/Wallpapers/1371177.png"

    [wallpaper.monitors.DP-3]
    path = "/home/gui/Pictures/Wallpapers/1371177.png"

[weather]
effects = true
enabled = true
refresh_minutes = 30
unit = "celsius"

[widget.control-center]
enabled = false

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.volume]
show_label = false
